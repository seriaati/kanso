x-kanso: &kanso
  image: ghcr.io/seriaati/kanso:latest
  build: . # used by `docker compose up --build` to run from source
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://kanso:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/kanso
    REDIS_URL: redis://redis:6379/0

services:
  app:
    <<: *kanso
    ports:
      - "${KANSO_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      start_period: 20s

  worker:
    <<: *kanso
    command: ["python", "-m", "kanso.worker"]
    depends_on:
      app:
        condition: service_healthy # migrations have run
    healthcheck:
      # The worker touches this file every 30s while its loop is alive.
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/kanso-worker-heartbeat') > 90)"]
      interval: 30s
      timeout: 5s
      start_period: 10s

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: kanso
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: kanso
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kanso", "-d", "kanso"]
      interval: 5s
      timeout: 5s
      start_period: 10s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s

volumes:
  postgres-data:
